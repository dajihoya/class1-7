<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>생명과학 시뮬레이션 모음</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap">
<style>
:root{--bg1:#ffffff;--bg2:#ffffff;--ink:#2b2f55;--muted:#6b7099;--line:#dde2f7;--pink:#ff6f91;
  --display:"Jua","Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",sans-serif;--body:"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",sans-serif;color-scheme:light}
*{box-sizing:border-box}
html,body{background-color:var(--bg1);color:var(--ink);margin:0}
body{background:#ffffff;
  min-height:100vh;font-family:var(--body);font-size:16px;line-height:1.6;padding:32px max(16px,env(safe-area-inset-right,0px)) 40px max(16px,env(safe-area-inset-left,0px))}
.wrap{max-width:980px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
header{display:flex;gap:14px;align-items:center}
h1{font-family:var(--display);font-weight:400;font-size:clamp(30px,5vw,46px);margin:0;line-height:1.15;word-break:keep-all}
header p{margin:2px 0 0;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:16px;max-width:760px}
a.card{display:flex;flex-direction:column;gap:8px;text-decoration:none;color:var(--ink);background:#fff;border:2px solid var(--line);border-radius:22px;padding:20px;box-shadow:0 8px 24px rgba(90,100,170,.10);transition:transform .15s,box-shadow .15s}
a.card:hover{transform:translateY(-3px);box-shadow:0 12px 28px rgba(90,100,170,.18)}
a.card:focus-visible{outline:3px solid var(--pink);outline-offset:3px}
.card h2{font-family:var(--display);font-weight:400;font-size:24px;margin:0}
.card p{margin:0;color:var(--muted);font-size:15px}
.go{margin-top:auto;align-self:flex-start;font-family:var(--display);color:#fff;background:var(--pink);border-radius:999px;padding:4px 14px}
.ico{width:56px;height:56px}
.up{align-self:flex-start;font-family:var(--display);text-decoration:none;color:var(--ink);background:#fff;border:2px solid var(--line);border-radius:999px;padding:4px 14px}
.up:hover{border-color:var(--pink)}
.up:focus-visible{outline:3px solid var(--pink);outline-offset:3px}
@media (prefers-reduced-motion:reduce){a.card{transition:none}}
</style>
<div class="wrap">
  <a class="up" href="../">← 과목 고르기</a>
  <header>
    <svg class="ico" viewBox="0 0 36 36" aria-hidden="true"><path d="M18 31C10 25 5 20.5 5 14.5 5 10.5 8 7.5 12 7.5c2.6 0 4.7 1.4 6 3.5 1.3-2.1 3.4-3.5 6-3.5 4 0 7 3 7 7 0 6-5 10.5-13 16.5z" fill="#ff7a96" stroke="#2b2f55" stroke-width="1.6" stroke-linejoin="round"/><path d="M9.5 15.5q0-3.5 3.5-4.5" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" opacity=".9"/><circle cx="14.5" cy="17" r="1.25" fill="#2b2f55"/><circle cx="21.5" cy="17" r="1.25" fill="#2b2f55"/><path d="M15.8 20.3q2.2 1.9 4.4 0" fill="none" stroke="#2b2f55" stroke-width="1.3" stroke-linecap="round"/></svg>
    <div><h1>생명과학 시뮬레이션 모음</h1><p>보고 싶은 자료를 골라 눌러 보세요.</p></div>
  </header>
  <div class="grid">
    <a class="card" href="nephron.html"><h2>콩팥단위 오줌 공장</h2><p>혈액이 콩팥단위를 지나며 여과·재흡수·분비를 거쳐 오줌이 되는 과정을 포도당, 요소 같은 입자 친구들과 함께 따라가 봐요.</p><span class="go">열기 →</span></a>
  </div>
</div>

</html>
