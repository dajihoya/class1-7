.card h2{font-family:var(--display);font-weight:400;font-size:24px;margin:0}
.card p{margin:0;color:var(--muted);font-size:15px}
.go{margin-top:auto;align-self:flex-start;font-family:var(--display);color:#fff;background:var(--pink);border-radius:999px;padding:4px 14px}
